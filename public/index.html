<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>마드리드 여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: a royal-blue sky. The hero pairs big white type with a 3D globe (pins on Madrid and Berlin,
   a dashed route, a plane overhead); below, white clay day cards side by side, rides as pale-blue tiles. */
:root {
  --bg: #cfe4ff; --sky-top: #4a86ea; --sky-bottom: #eef5ff; --hero-top: #1d5fd8; --hero-mid: #3f86ef; --hero-bottom: #9cc8ff;
  --hero-ink: #ffffff; --hero-glass: rgb(255 255 255 / .2);
  --card: #ffffff; --card-edge: #cddcf3; --ink: #13294b; --muted: #5a6f8f; --line: #e2ebf7;
  --accent: #2f6fe8; --accent-2: #5d9bff; --accent-edge: #1d4fb5; --accent-ink: #1f58cc; --accent-soft: #e8f1ff;
  --on-accent: #ffffff; --pin: #ffc23d; --pin-edge: #d99a14; --on-pin: #3a2600;
  --cloud: #ffffff; --shadow: rgb(30 70 140 / .25); --glass: rgb(255 255 255 / .7); --danger: #c0392b;
  --display: "Jua", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1830; --sky-top: #0a1630; --sky-bottom: #15284a; --hero-top: #0f2f6e; --hero-mid: #1d4fa8; --hero-bottom: #3c6fc4;
  --hero-ink: #ffffff; --hero-glass: rgb(255 255 255 / .14);
  --card: #152a4a; --card-edge: #0a1832; --ink: #e8f0fc; --muted: #9fb3d1; --line: #23395e;
  --accent: #3f7ff0; --accent-2: #6d9fff; --accent-edge: #1f4790; --accent-ink: #8db6ff; --accent-soft: #1b3360;
  --on-accent: #ffffff; --pin: #ffc23d; --pin-edge: #c48a10; --on-pin: #3a2600;
  --cloud: #2c4670; --shadow: rgb(0 0 0 / .45); --glass: rgb(255 255 255 / .12); --danger: #ff8b7e; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1830; --sky-top: #0a1630; --sky-bottom: #15284a; --hero-top: #0f2f6e; --hero-mid: #1d4fa8; --hero-bottom: #3c6fc4;
  --hero-ink: #ffffff; --hero-glass: rgb(255 255 255 / .14);
  --card: #152a4a; --card-edge: #0a1832; --ink: #e8f0fc; --muted: #9fb3d1; --line: #23395e;
  --accent: #3f7ff0; --accent-2: #6d9fff; --accent-edge: #1f4790; --accent-ink: #8db6ff; --accent-soft: #1b3360;
  --on-accent: #ffffff; --pin: #ffc23d; --pin-edge: #c48a10; --on-pin: #3a2600;
  --cloud: #2c4670; --shadow: rgb(0 0 0 / .45); --glass: rgb(255 255 255 / .12); --danger: #ff8b7e; color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg) linear-gradient(180deg, var(--sky-top), var(--sky-bottom) 70%) fixed; color: var(--ink); font: 400 15px/1.6 var(--body); word-break: keep-all; overflow-wrap: anywhere; min-height: 100vh }
#app { max-width: 1080px; margin: 0 auto; padding-block: 20px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px }
button, select, input, textarea { font: inherit; color: inherit }
button { cursor: pointer; background: none; border: 0; padding: 0 }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
a { color: inherit }
img { max-width: 100% }

/* chunky, pressable controls */
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.bar select { flex: 1 1 180px; min-width: 0 }
select, input, textarea { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 9px 12px; width: 100% }
.btn { background: var(--card); border-radius: 14px; padding: 9px 16px; font-weight: 700; white-space: nowrap; box-shadow: 0 4px 0 var(--card-edge), 0 8px 18px -10px var(--shadow); transition: transform .08s, box-shadow .08s }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--card-edge) }
.btn.primary { background: linear-gradient(180deg, var(--accent-2), var(--accent)); color: var(--on-accent); box-shadow: 0 4px 0 var(--accent-edge), 0 10px 20px -10px var(--accent-edge) }
.btn.primary:active { box-shadow: 0 1px 0 var(--accent-edge) }
.btn.danger { color: var(--danger) }
.link { color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 2px }
.link:hover { color: var(--ink) }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 32px; padding: 30px 30px 26px 34px; background: linear-gradient(135deg, var(--hero-top), var(--hero-mid) 55%, var(--hero-bottom)); color: var(--hero-ink); box-shadow: inset 0 2px 0 rgb(255 255 255 / .3), 0 6px 0 var(--card-edge), 0 24px 40px -22px var(--shadow); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 470px); align-items: center; gap: 12px; isolation: isolate }
.hero::before { content: ""; position: absolute; z-index: -1; width: 520px; height: 520px; right: -90px; top: 50%; transform: translateY(-50%); border-radius: 50%; background: radial-gradient(circle, rgb(255 255 255 / .22) 0 52%, rgb(255 255 255 / .1) 52% 70%, transparent 70%) }
.hero-text { display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.hero-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .04em; background: var(--hero-glass); padding: 4px 12px; border-radius: 999px }
.dday { font: 400 22px/1 var(--display); color: var(--on-pin); background: var(--pin); padding: 8px 14px; border-radius: 14px; box-shadow: 0 4px 0 var(--pin-edge) }
.hero h1 { font: 400 clamp(46px, 9vw, 76px)/1 var(--display); margin: 4px 0 0; text-shadow: 0 4px 0 rgb(0 0 0 / .14); text-wrap: balance }
.hero p { margin: 0; font-weight: 500; opacity: .92 }
.steps { list-style: none; margin: 8px 0 0; padding: 0; display: flex; gap: 10px; flex-wrap: wrap }
.steps button { display: flex; align-items: center; gap: 8px; background: var(--card); color: var(--ink); border-radius: 999px; padding: 5px 14px 5px 5px; font-weight: 700; font-size: 14px; box-shadow: 0 4px 0 rgb(0 0 0 / .14) }
.steps button:active { transform: translateY(2px) }
.steps b { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; font: 400 15px var(--display); background: linear-gradient(180deg, var(--accent-2), var(--accent)); color: var(--on-accent); box-shadow: inset 0 -3px 0 var(--accent-edge) }
.steps .is-today b { background: var(--pin); color: var(--on-pin); box-shadow: inset 0 -3px 0 var(--pin-edge) }
.globe { width: 100%; max-width: 470px; height: auto; justify-self: end; filter: drop-shadow(0 22px 22px rgb(8 30 90 / .35)) }
.globe .gplane { animation: float 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center }
.globe .gpin { animation: bob 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom }
.globe .gpin.p2 { animation-delay: -1.3s }
@keyframes float { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
@keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
@media (prefers-reduced-motion: reduce) { .globe .gplane, .globe .gpin { animation: none } }

.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap }
.tabs { display: flex; gap: 4px; background: var(--card); padding: 5px; border-radius: 999px; box-shadow: 0 4px 0 var(--card-edge) }
.tabs button { padding: 7px 18px; border-radius: 999px; font: 400 16px var(--display); color: var(--muted) }
.tabs button[aria-selected="true"] { background: linear-gradient(180deg, var(--accent-2), var(--accent)); color: var(--on-accent); box-shadow: inset 0 -3px 0 var(--accent-edge) }
.nav > .link { background: var(--card); padding: 7px 14px; border-radius: 999px; text-decoration: none; font-weight: 700; color: var(--ink); box-shadow: 0 3px 0 var(--card-edge) }

/* day cards */
.days { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; align-items: start }
.day { display: flex; flex-direction: column; min-width: 0; background: var(--card); border-radius: 26px; padding: 18px 18px 12px; box-shadow: inset 0 2px 0 rgb(255 255 255 / .5), 0 6px 0 var(--card-edge), 0 20px 34px -22px var(--shadow); scroll-margin-top: 16px }
.day-head { display: flex; align-items: center; gap: 12px; padding-bottom: 10px; margin-bottom: 4px; border-bottom: 2px dashed var(--line) }
.badge { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; font: 400 22px var(--display); background: linear-gradient(180deg, var(--accent-2), var(--accent)); color: var(--on-accent); box-shadow: inset 0 -4px 0 var(--accent-edge), 0 6px 12px -6px var(--accent-edge) }
.day-head h2 { font: 400 20px/1.2 var(--display); margin: 0 }
.day-head div > span { color: var(--muted); font-size: 13px }
.day-head .tag { margin-left: auto; color: var(--on-accent); background: var(--accent-2); font-weight: 700; padding: 2px 10px; border-radius: 999px }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 2px; border-bottom: 1px solid var(--line) }
.row:last-child { border-bottom: 0 }
.row.ride { background: linear-gradient(180deg, var(--accent-soft), var(--accent-soft)); border-bottom-color: transparent; border-radius: 16px; padding: 10px 12px; margin-block: 6px; box-shadow: inset 0 -3px 0 rgb(0 0 0 / .05) }
.when { display: flex; align-items: center; gap: 6px; font: 500 13px/1.5 var(--mono); color: var(--accent-ink) }
.when svg { width: 18px; height: 18px; flex: none }
.row h3 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.45 }
.row-acts { display: flex; gap: 10px; align-items: flex-start }
.row-acts .link { line-height: 1.8; text-decoration: none }
.sub { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 12px }
.sub a { color: var(--accent-ink); text-underline-offset: 2px; font-weight: 500 }
.memo { font-size: 13px; margin: 1px 0 0; white-space: pre-wrap; color: var(--muted) }
.photos { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 2px }
.photos figure { margin: 0; width: 104px }
.photos img { display: block; width: 104px; height: 78px; object-fit: cover; border-radius: 14px; background: var(--line); box-shadow: 0 4px 0 var(--card-edge), 0 8px 14px -8px var(--shadow) }
.photos figcaption { font-size: 11px; line-height: 1.35; margin-top: 6px; color: var(--muted) }
.credits { font-size: 11px; line-height: 1.6; color: var(--ink); opacity: .7; margin: 0 }
.empty-day { padding: 14px 0; color: var(--muted); font-size: 14px }
.num { font-variant-numeric: tabular-nums }

/* talk */
.talk { display: flex; flex-direction: column; gap: 14px; max-width: 720px; width: 100%; background: var(--card); border-radius: 26px; padding: 18px; box-shadow: inset 0 2px 0 rgb(255 255 255 / .5), 0 6px 0 var(--card-edge), 0 20px 34px -22px var(--shadow) }
.talk-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap }
.talk-head .notice { margin: 0 }
.seg { display: flex; background: var(--bg); border-radius: 999px; padding: 3px }
.seg button { padding: 4px 12px; font-size: 13px; font-weight: 700; color: var(--muted); border-radius: 999px }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 2px 0 var(--card-edge) }
.msgs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px }
.msg { display: flex; gap: 8px; align-items: flex-start; max-width: 88% }
.msg.mine { margin-left: auto; flex-direction: row-reverse }
.av { flex: none; width: 34px; height: 34px; border-radius: 12px; background: var(--line); display: grid; place-items: center; font: 400 15px var(--display); box-shadow: inset 0 -3px 0 rgb(0 0 0 / .08) }
.mine .av { background: linear-gradient(180deg, var(--accent-2), var(--accent)); color: var(--on-accent); box-shadow: inset 0 -3px 0 var(--accent-edge) }
.bubble { background: var(--bg); border-radius: 18px; border-top-left-radius: 6px; padding: 8px 14px 9px; min-width: 0 }
.mine .bubble { background: var(--accent-soft); border-radius: 18px; border-top-right-radius: 6px }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; font-size: 12px; color: var(--muted) }
.meta b { color: var(--ink); font-weight: 700 }
.meta .link { font-size: 12px }
.text { margin: 2px 0 0; white-space: pre-wrap }
.todo { display: flex; gap: 8px; align-items: flex-start; margin-top: 2px; cursor: pointer }
.todo input, .chk input { width: 18px; height: 18px; flex: none; margin: 3px 0 0; accent-color: var(--accent) }
.todo .text { margin: 0 }
.todo.done .text { color: var(--muted); text-decoration: line-through }
.todo-tag { font-size: 11px; font-weight: 700; color: var(--accent-ink) }
.composer { position: sticky; bottom: 0; background: var(--card); border-top: 2px dashed var(--line); padding-block: 12px calc(4px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px }
.composer textarea { resize: vertical; min-height: 64px }
.composer-row { display: flex; justify-content: space-between; align-items: center; gap: 12px }
.composer-acts { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: flex-end }
.chk { display: flex; gap: 6px; align-items: flex-start; font-size: 14px; cursor: pointer }

.notice { font-size: 13px; color: var(--muted) }
.welcome { margin-top: 40px; padding: 32px; background: var(--card); border-radius: 28px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; box-shadow: 0 6px 0 var(--card-edge), 0 20px 34px -22px var(--shadow) }
.welcome h1 { font: 400 32px/1.2 var(--display); margin: 0 }
.welcome p { margin: 0; max-width: 34em; color: var(--muted) }

.sheet-wrap { position: fixed; inset: 0; background: rgb(8 30 50 / .45); display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 20 }
.sheet { background: var(--card); border-radius: 26px; width: 100%; max-width: 460px; max-height: 100%; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 6px 0 var(--card-edge), 0 30px 50px -20px var(--shadow) }
.sheet h2 { font: 400 26px var(--display); margin: 0 }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; min-width: 0 }
.field input, .field select, .field textarea { font-weight: 400; font-size: 15px }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
.sheet-foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px }
.sheet-foot .grow { flex: 1 }
.err { color: var(--danger); font-size: 13px; margin: 0 }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--card); padding: 10px 16px; border-radius: 14px; font-size: 14px; max-width: calc(100% - 32px); z-index: 30 }

@media (max-width: 640px) {
  .hero { grid-template-columns: minmax(0, 1fr); padding: 18px 20px 22px; border-radius: 26px }
  .hero::before { width: 380px; height: 380px; right: 50%; top: 0; transform: translate(50%, -22%) }
  .globe { order: -1; justify-self: center; max-width: 290px; margin: -6px 0 -10px }
}
</style>
</head>
<body>
<div id="app" aria-live="off"></div>
<div id="sheet-root"></div>
<div id="toast" role="status" hidden></div>
<script>
const CATS = ["이동", "숙소", "식사", "관광", "쇼핑", "기타"];
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const $app = document.getElementById("app");
const $sheet = document.getElementById("sheet-root");
const S = { trips: [], tripId: null, tab: "plan", edit: false, status: "loading",
  talk: [], talkReady: false, talkFilter: "all", asTodo: false };
const pending = {}, inflight = {}, busy = {};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
const pad = n => String(n).padStart(2, "0");
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d) };
const fmt = s => { const d = parse(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})` };
const short = s => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()} ${WD[d.getDay()]}` };
const today = () => toISO(new Date());
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const money = (n, t) => `${t.currency || ""}${Number(n || 0).toLocaleString("ko-KR")}`;
const mapUrl = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const trip = () => S.trips.find(t => t.id === S.tripId) || null;
const byStart = (a, b) => (a.start || "").localeCompare(b.start || "");
function insertItem(items, item) {
  const out = items.slice();
  const at = item.time ? out.findIndex(i => i.date === item.date && i.time && i.time > item.time) : -1;
  if (at >= 0) out.splice(at, 0, item); else out.push(item);
  return out;
}
function moveItem(items, id, dir) {
  const out = items.slice(), from = out.findIndex(i => i.id === id);
  const same = out.map((x, n) => x.date === out[from].date ? n : -1).filter(n => n >= 0);
  const to = same[same.indexOf(from) + dir];
  if (to === undefined) return out;
  [out[from], out[to]] = [out[to], out[from]];
  return out;
}
function daysOf(t) {
  const out = new Set();
  if (t.start && t.end) for (let d = parse(t.start); toISO(d) <= t.end; d.setDate(d.getDate() + 1)) out.add(toISO(d));
  (t.items || []).forEach(i => i.date && out.add(i.date));
  return [...out].sort();
}
function dayNo(t, date) { return date >= t.start && date <= t.end ? diffDays(t.start, date) + 1 : null }
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3500);
}

/* ---------- server: everyone with the invite key reads and writes ---------- */
const KEY = new URLSearchParams(location.search).get("k") || store.get("tripKey") || "";
if (KEY) store.set("tripKey", KEY);
const ME = store.get("clientId") || uid();
store.set("clientId", ME);
let NICK = store.get("nick") || "";

async function api(method, params, body) {
  const res = await fetch("/api?" + new URLSearchParams(params), {
    method, headers: { "Content-Type": "application/json", "X-Trip-Key": KEY },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || "요청 실패"), { status: res.status });
  return data;
}
function failed(e) {
  if (e.status === 401) { S.status = "badkey"; render() }
  else toast(e.status === 413 ? "내용이 너무 길어요. 조금 줄여서 다시 시도해 주세요." : e.status === 403 || e.status === 404 ? e.message : "저장하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.");
}
async function persist(t) {
  pending[t.id] = t;
  if (busy[t.id]) return;
  busy[t.id] = true;
  while (pending[t.id]) {
    const body = inflight[t.id] = pending[t.id]; delete pending[t.id];
    try { await api("PUT", { r: "trip" }, { trip: body }) } catch (e) { failed(e) }
  }
  delete inflight[t.id];
  busy[t.id] = false;
}
function commit(t) {
  const i = S.trips.findIndex(x => x.id === t.id);
  if (i < 0) S.trips.push(t); else S.trips[i] = t;
  S.trips.sort(byStart);
  persist(t); render();
}
function removeTrip(id) {
  S.trips = S.trips.filter(t => t.id !== id);
  api("DELETE", { r: "trip", id }).catch(failed);
  if (S.tripId === id) { S.tripId = null; pickTrip(); resetTalk() }
  render();
}
function pickTrip() {
  if (trip()) return;
  const saved = store.get("trip"), d = today();
  const t = S.trips.find(x => x.id === saved) || S.trips.find(x => x.end >= d) || S.trips[S.trips.length - 1];
  S.tripId = t ? t.id : null;
}
let lastTrips = "", lastTalk = "";
async function loadTrips() {
  try {
    const { trips } = await api("GET", { r: "trips" });
    const sig = JSON.stringify(trips), first = S.status !== "ready";
    S.trips = trips.map(t => pending[t.id] || inflight[t.id] || t).sort(byStart);
    S.status = "ready"; pickTrip();
    if (first || sig !== lastTrips) { lastTrips = sig; render() }
    if (first) loadTalk();
  } catch (e) {
    if (e.status === 401) S.status = "badkey";
    else if (S.status === "ready") return;
    else { S.status = "error"; S.error = e.message }

  }
}

/* ---------- talk ---------- */
function resetTalk() { S.talk = []; S.talkReady = false; lastTalk = ""; loadTalk() }
async function loadTalk() {
  const id = S.tripId;
  if (!id) return;
  try {
    const { msgs } = await api("GET", { r: "talk", trip: id });
    if (id !== S.tripId) return;
    const sig = JSON.stringify(msgs);
    if (sig !== lastTalk || !S.talkReady) { lastTalk = sig; S.talk = msgs; S.talkReady = true; render() }
  } catch (e) { if (e.status === 401) failed(e) }
}
async function postTalk(text, todo) {
  S.talk.push({ id: "tmp-" + uid(), text, todo, done: false, author: NICK, authorId: ME, at: Date.now() });
  render();
  try { await api("POST", { r: "talk", trip: S.tripId }, { text, todo, author: NICK, authorId: ME }) } catch (e) { failed(e) }
  loadTalk();
}
async function setDone(id, done) {
  S.talk = S.talk.map(m => m.id === id ? { ...m, done, doneBy: NICK, doneById: ME } : m);
  render();
  try { await api("PATCH", { r: "talk", trip: S.tripId }, { id, done, doneBy: NICK, doneById: ME }) } catch (e) { failed(e) }
  loadTalk();
}
async function deleteTalk(id) {
  S.talk = S.talk.filter(m => m.id !== id);

}

  if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, t = trip();
  if (a === "close-bg") { if (e.target === el) closeSheet(); return }
  if (a === "tab") { S.tab = v; render(); if (v === "talk") loadTalk() }
  else if (a === "toggle-edit") { S.edit = !S.edit; render() }
  else if (a === "invite") copyInvite()
  else if (a === "jump") {
    if (S.tab !== "plan") { S.tab = "plan"; render() }
    const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.getElementById("day-" + v)?.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
  }
  else if (a === "new-trip") tripSheet(null)
  else if (a === "edit-trip") tripSheet(t)
  else if (a === "new-item") itemSheet(t, null)
  else if (a === "edit-item") itemSheet(t, t.items.find(i => i.id === v))
  else if (a === "close") closeSheet()
  else if (a === "move-up" || a === "move-down") commit({ ...t, items: moveItem(t.items, v, a === "move-up" ? -1 : 1) })
  else if (a === "talk-filter") { S.talkFilter = v; render() }
  else if (a === "change-nick") { NICK = ""; store.set("nick", ""); render(); document.getElementById("nick-input")?.focus() }
  else if (a === "del-msg") {
    if (el.dataset.armed) deleteTalk(v);
    else { el.dataset.armed = "1"; el.textContent = "한 번 더 누르면 삭제" }
  }
  else if (a === "arm-del") {
    if (el.dataset.armed) {
      if (el.dataset.del === "trip") removeTrip(v);
      else commit({ ...t, items: t.items.filter(i => i.id !== v) });
      closeSheet();
    } else { el.dataset.armed = "1"; el.textContent = el.dataset.del === "trip" ? "한 번 더 누르면 여행 전체 삭제" : "한 번 더 누르면 삭제" }
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "trip-select") { S.tripId = e.target.value; store.set("trip", S.tripId); resetTalk(); render() }
  if (e.target.id === "talk-todo") S.asTodo = e.target.checked;
  if (e.target.dataset.todo) setDone(e.target.dataset.todo, e.target.checked);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  // Enter sends, Shift+Enter adds a line; skip while a Korean IME is still composing
  if (e.target.id === "talk-new" && e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault(); e.target.form.requestSubmit();
  }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const kind = e.target.dataset.form, id = e.target.dataset.id;
  if (kind === "nick") {
    NICK = val("nick-input").slice(0, 20);
    if (!NICK) return;
    store.set("nick", NICK); render(); document.getElementById("talk-new")?.focus();
  }
  if (kind === "talk") {
    const input = document.getElementById("talk-new"), text = input.value.trim();
    if (!text) return;
    input.value = "";
    postTalk(text, S.asTodo);
    requestAnimationFrame(() => document.querySelector(".composer")?.scrollIntoView({ block: "end" }));
  }
  if (kind === "trip") {
    const start = val("t-start"), end = val("t-end");
    if (end < start) { const err = document.getElementById("sheet-err"); err.textContent = "도착일은 출발일과 같거나 그 뒤여야 해요."; err.hidden = false; return }
    const old = S.trips.find(t => t.id === id);
    const t = { ...(old || { id: uid(), items: [], currency: "₩" }), name: val("t-name"), dest: val("t-dest"), start, end };
    closeSheet(); commit(t);
    if (!old) { S.tripId = t.id; S.tab = "plan"; store.set("trip", t.id); resetTalk(); render() }
  }
  if (kind === "item") {
    const t = trip();
    const old = (t.items || []).find(i => i.id === id);
    const item = { ...old, id: id || uid(), title: val("i-title"), date: val("i-date"), time: val("i-time"), end: val("i-end"), cat: val("i-cat"), place: val("i-place"), memo: val("i-memo") };
    const items = old && old.date === item.date && old.time === item.time
      ? t.items.map(i => i.id === id ? item : i)
      : insertItem((t.items || []).filter(i => i.id !== id), item);
    closeSheet(); commit({ ...t, items });
  }
});

/* ---------- start: talk refreshes every 4 s, the itinerary every 30 s ---------- */
if (!KEY) { S.status = "nokey"; render() }
else {
  render(); loadTrips();
  setInterval(() => { if (!document.hidden && S.status === "ready") loadTalk() }, 4000);
  setInterval(() => { if (!document.hidden && S.status === "ready") loadTrips() }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.status === "ready") { loadTrips(); loadTalk() } });
}
</script>
</body>
</html>
